<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room A101 Digital Signage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the signage look */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light blue background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .signage-container {
            width: 100%;
            max-width: 1400px; /* Large screen size for signage */
            background-color: white;
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 1.5rem;
            padding: 2rem;
        }
        /* Style for the current class card when an event is running */
        .current-class-running {
            background: linear-gradient(135deg, #e0f2fe 0%, #c7d2fe 100%); /* Light gradient background */
            border-left: 8px solid #3b82f6;
            animation: pulse 2s infinite ease-in-out; /* Subtle pulse animation */
        }
        /* Style for the current class card when showing the next event */
        .current-class-upcoming {
            background-color: #f3f4f6;
            border-left: 8px solid #f59e0b;
        }
        .schedule-item {
            border-bottom: 1px solid #e5e7eb;
            transition: background-color 0.2s;
        }
        .schedule-item:last-child {
            border-bottom: none;
        }
        .tag-pill {
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 9999px;
            text-transform: uppercase;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 5px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="selection:bg-blue-200">

    <div class="signage-container">
        
        <header class="flex justify-between items-start mb-6 border-b pb-4">
            <div>
                <h1 class="text-4xl font-extrabold text-gray-800">ROOM A101</h1>
                <p class="text-lg text-gray-500 font-medium">Main Lecture Hall</p>
            </div>
            <div class="text-right">
                <p class="text-xl font-bold text-gray-700" id="current-date">--</p>
                <p class="text-5xl font-extrabold text-blue-600" id="current-time">--:--:--</p>
            </div>
        </header>

        <section class="mb-8 p-6 rounded-xl transition-all duration-300" id="current-class-section">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold uppercase tracking-wider text-blue-700" id="current-class-title">Current Status</h2>
                <div class="text-2xl font-extrabold text-blue-800" id="current-class-time-range">--:-- – --:--</div>
            </div>
            <div id="current-class-details">
                <p class="text-gray-500">Loading schedule...</p>
            </div>
        </section>

        <section class="mt-8">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2 text-gray-700">Today's Upcoming Schedule</h2>
            <div id="schedule-list" class="divide-y divide-gray-200 border border-gray-200 rounded-xl overflow-hidden">
                <div class="p-4 text-center text-gray-500">Schedule data will load here.</div>
            </div>
        </section>

        <footer class="mt-8 p-4 bg-yellow-50 rounded-xl border-t border-yellow-200">
            <h3 class="text-lg font-bold text-yellow-800">ANNOUNCEMENT</h3>
            <p class="text-sm text-yellow-700">Please ensure all mobile devices are silenced before entering the lecture hall.</p>
        </footer>

    </div>

    <script>
        // === CONFIGURATION ===
        // IMPORTANT: Replace this URL with the public CSV link from your Google Sheet.
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS8ISzjAwQVyoT1D0jXFmurBOoMfEpMhIbjO1P1gSpLgLgUSSVaaT6v_fr0zXKrOhsxBuvwpqjI5UWn/pub?output=csv";
        const REFRESH_INTERVAL_MS = 5000; // 5 seconds (for data fetch)
        const CLOCK_INTERVAL_MS = 1000; // 1 second (for clock refresh)
        
        // ** The 5-minute buffer is maintained here, which is why the "CURRENT CLASS" appears early.
        // ** Change 5 to a smaller number (e.g., 2) if you want the "CURRENT CLASS" sign to appear closer to the start time.
        const START_END_BUFFER_MINUTES = 5; 

        // Global variable to store the last fetched schedule data (used by the 1-second clock update)
        window.lastScheduleData = null; 

        // Mock CSV Data for demonstration.
        const MOCK_CSV_DATA = `TimeStart,TimeEnd,CourseName,Professor,Tag,Status
08:00,09:30,Introduction to Quantum Physics,Professor Richard Feynman,ENG - MECHANICAL ENGINEERING - YEAR 1,regular
09:30,11:00,Differential Equations,Professor Maria Curie,MAT - ADVANCED MATH,regular
11:00,12:30,Lunch Break,N/A,BREAK,break
14:00,15:30,Aircraft Systems,Professor Amelia Earhart,AVN - AVIONICS B2 - YEAR 2,regular
15:30,17:00,Supply Chain Fundamentals,Professor J. Morgan,BUS - LOGISTICS - YEAR 1,cancelled
17:00,18:30,Advanced Algorithms,Professor Alan Turing,CSC - COMPUTER SCIENCE,regular
18:30,20:00,Evening Seminar: Future of AI,Dr. Ada Lovelace,CSC - SEMINAR,regular
`;

        // === UTILITY FUNCTIONS ===

        /**
         * Parses a CSV string into an array of objects.
         */
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) return [];

            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const dataLines = lines.slice(1);
            
            return dataLines.map(line => {
                const values = line.split(',').map(v => v.trim().replace(/"/g, ''));
                if (values.length !== headers.length) return null;

                return headers.reduce((obj, header, index) => {
                    obj[header] = values[index];
                    return obj;
                }, {});
            }).filter(item => item !== null);
        }

        /**
         * Checks if a class is currently happening, upcoming, or past.
         * Includes the START_END_BUFFER_MINUTES buffer before and after.
         */
        function getClassStatus(startTime, endTime) {
            const now = new Date();
            // Use current date to create full Date objects for comparison
            const today = now.toDateString(); 

            const [startHour, startMinute] = startTime.split(':').map(Number);
            const [endHour, endMinute] = endTime.split(':').map(Number);

            const startDateTime = new Date(today);
            startDateTime.setHours(startHour, startMinute, 0, 0);

            const endDateTime = new Date(today);
            endDateTime.setHours(endHour, endMinute, 0, 0);

            // Calculate buffer in milliseconds
            const BUFFER = START_END_BUFFER_MINUTES * 60 * 1000; 
            
            // Starts checking BUFFER minutes before the official start
            const bufferStartDateTime = new Date(startDateTime.getTime() - BUFFER);
            // Stops checking BUFFER minutes after the official end
            const bufferEndDateTime = new Date(endDateTime.getTime() + BUFFER);
            
            if (now >= bufferStartDateTime && now < bufferEndDateTime) {
                return 'current';
            } else if (now < bufferStartDateTime) {
                return 'upcoming';
            } else {
                return 'past';
            }
        }

        /**
         * Creates an HTML string for a schedule item tag pill with consistent colors.
         */
        function createTagPill(tagText) {
            let hash = 0;
            for (let i = 0; i < tagText.length; i++) {
                hash = tagText.charCodeAt(i) + ((hash << 5) - hash);
            }
            const colors = ['#3b82f6', '#10b981', '#f97316', '#8b5cf6', '#ef4444', '#06b6d4'];
            const bgColor = colors[Math.abs(hash) % colors.length];

            return `<span class="tag-pill" style="background-color: ${bgColor}; color: white;">${tagText}</span>`;
        }

        // === RENDERING FUNCTIONS ===

        /**
         * Renders the current date and time in the header AND re-evaluates schedule status.
         * (Fix for the flickering issue by running schedule logic every second.)
         */
        function updateDateTime() {
            const now = new Date();
            const dateOptions = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };

            document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', dateOptions);
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-US', timeOptions);
            
            // FIX: Force a re-render of the schedule using the last fetched data
            // to ensure the 'current' class status is evaluated every second against the clock.
            if (window.lastScheduleData) {
                renderSchedule(window.lastScheduleData);
            }
        }

        /**
         * Renders the schedule data into the HTML elements.
         */
        function renderSchedule(scheduleData) {
            const currentClassSection = document.getElementById('current-class-section');
            const currentClassTitle = document.getElementById('current-class-title');
            const currentClassTimeRange = document.getElementById('current-class-time-range');
            const currentClassDetails = document.getElementById('current-class-details');
            const scheduleList = document.getElementById('schedule-list');

            let currentClass = null;
            let upcomingClasses = [];

            // 1. Determine status for all classes and separate them
            scheduleData.forEach(item => {
                if (!item.TimeStart || !item.TimeEnd) return; 

                const status = getClassStatus(item.TimeStart, item.TimeEnd);
                
                if (status === 'current' && item.Status.toLowerCase() !== 'cancelled') {
                    currentClass = item;
                } else if (status === 'upcoming' || (status === 'current' && item.Status.toLowerCase() === 'cancelled')) {
                    upcomingClasses.push(item);
                }
            });

            // If no class is currently running, find the next one from the upcoming list
            if (!currentClass && upcomingClasses.length > 0) {
                upcomingClasses.sort((a, b) => a.TimeStart.localeCompare(b.TimeStart));
                currentClass = upcomingClasses.shift(); 
            }
            
            // 2. Render Current Class Card
            currentClassSection.classList.remove('current-class-running', 'current-class-upcoming');

            if (currentClass) {
                // Determine if the class is actually running or just in the pre-start buffer
                const isRunning = getClassStatus(currentClass.TimeStart, currentClass.TimeEnd) === 'current' && currentClass.Status.toLowerCase() !== 'cancelled';
                
                if (isRunning) {
                    // Check if we are in the buffer time
                    const now = new Date();
                    const [startHour, startMinute] = currentClass.TimeStart.split(':').map(Number);
                    const startDateTime = new Date(now.toDateString());
                    startDateTime.setHours(startHour, startMinute, 0, 0);
                    const bufferStartDateTime = new Date(startDateTime.getTime() - (START_END_BUFFER_MINUTES * 60 * 1000));

                    if (now < startDateTime && now >= bufferStartDateTime) {
                         currentClassTitle.textContent = `NEXT CLASS STARTING AT (Buffer)`; // Clearer title during the buffer
                    } else {
                         currentClassTitle.textContent = "CURRENT CLASS IN SESSION";
                    }
                    
                    currentClassSection.classList.add('current-class-running');
                } else {
                    currentClassTitle.textContent = "NEXT CLASS STARTING AT";
                    currentClassSection.classList.add('current-class-upcoming');
                }
                
                // Handle cancellation status for the main card
                const isCancelled = currentClass.Status.toLowerCase() === 'cancelled';
                const courseName = isCancelled ? `**CANCELLED** - ${currentClass.CourseName}` : currentClass.CourseName;
                const professorName = isCancelled ? `(Check with department)` : currentClass.Professor;
                const courseClass = isCancelled ? 'text-red-700' : 'text-gray-900';
                const professorClass = isCancelled ? 'text-red-500' : 'text-gray-700';

                currentClassTimeRange.textContent = `${currentClass.TimeStart} – ${currentClass.TimeEnd}`;
                currentClassDetails.innerHTML = `
                    <h3 class="text-4xl font-extrabold ${courseClass}">${courseName}</h3>
                    <p class="text-2xl font-semibold ${professorClass} mt-1">${professorName}</p>
                    <div class="mt-3">
                        ${createTagPill(currentClass.Tag)}
                        ${isCancelled ? `<span class="tag-pill bg-red-600 text-white ml-2">CANCELLED</span>` : ''}
                    </div>
                `;

            } else {
                currentClassTitle.textContent = "Schedule Complete";
                currentClassTimeRange.textContent = `--:--`;
                currentClassDetails.innerHTML = `<p class="text-2xl font-medium text-gray-700">No more classes scheduled for today.</p>`;
                currentClassSection.classList.add('current-class-upcoming'); 
            }

            // 3. Render Upcoming Schedule List (only items that haven't happened yet)
            const upcomingToDisplay = upcomingClasses.filter(item => {
                // Keep only items that are truly upcoming, or are currently cancelled.
                const status = getClassStatus(item.TimeStart, item.TimeEnd);
                return (status === 'upcoming' || item.Status.toLowerCase() === 'cancelled');
            });
            
            // Sort the list view by start time
            upcomingToDisplay.sort((a, b) => a.TimeStart.localeCompare(b.TimeStart));

            if (upcomingToDisplay.length > 0) {
                scheduleList.innerHTML = upcomingToDisplay.map(item => {
                    let statusHtml = '';
                    let statusClass = '';

                    if (item.Status.toLowerCase() === 'cancelled') {
                        statusHtml = `<span class="tag-pill bg-red-600 text-white">CANCELLED</span>`;
                        statusClass = 'opacity-50 line-through';
                    } else if (item.Status.toLowerCase() === 'break') {
                        statusHtml = `<span class="tag-pill bg-gray-500 text-white">BREAK</span>`;
                    }
                    
                    return `
                        <div class="schedule-item p-4 flex justify-between items-start hover:bg-gray-50">
                            <div class="${statusClass}">
                                <div class="text-xl font-bold text-gray-900">${item.TimeStart} – ${item.TimeEnd}</div>
                                <div class="text-2xl font-semibold text-gray-800">${item.CourseName}</div>
                                <div class="text-base text-gray-500">${item.Professor}</div>
                            </div>
                            <div class="text-right flex flex-col items-end space-y-2">
                                ${item.Status.toLowerCase() !== 'break' ? createTagPill(item.Tag) : ''}
                                ${statusHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            } else if (currentClass) {
                 scheduleList.innerHTML = `<div class="p-4 text-center text-lg text-gray-600 font-medium">No other classes immediately following the current event.</div>`;
            } else {
                scheduleList.innerHTML = `<div class="p-4 text-center text-lg text-gray-600 font-medium">No more upcoming classes. Enjoy the rest of the day!</div>`;
            }
        }


        // === DATA FETCHING & SCHEDULING ===

        /**
         * Fetches data from the Google Sheet URL (or uses mock data) and triggers rendering.
         */
        async function fetchAndRenderSchedule() {
            let data = null;
            let useMock = (GOOGLE_SHEET_CSV_URL === "MOCK_DATA_URL");

            if (useMock) {
                console.warn("Using MOCK DATA because GOOGLE_SHEET_CSV_URL is the default placeholder.");
                data = MOCK_CSV_DATA;
            } else {
                try {
                    // cache: 'no-store' is critical to ensure the browser fetches the latest version
                    const response = await fetch(GOOGLE_SHEET_CSV_URL, { cache: 'no-store' }); 
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    data = await response.text();
                    console.log("Successfully fetched data from Google Sheet.");
                } catch (error) {
                    console.error("Error fetching schedule data from Google Sheet URL. Falling back to mock data.", error);
                    data = MOCK_CSV_DATA;
                    document.getElementById('schedule-list').innerHTML = `<div class="p-4 text-center text-red-600 font-bold">WARNING: Could not fetch live schedule! Showing cached/mock data.</div>`;
                }
            }

            if (data) {
                const scheduleData = parseCSV(data);
                if (scheduleData.length > 0) {
                    // Store the successfully fetched data globally for the clock interval to use
                    window.lastScheduleData = scheduleData; 
                    renderSchedule(scheduleData);
                } else {
                     document.getElementById('schedule-list').innerHTML = `<div class="p-4 text-center text-lg text-gray-600 font-medium">Schedule is empty or malformed.</div>`;
                }
            }
        }


        // === INITIALIZATION ===

        // 1. Initial date/time update (runs immediately)
        updateDateTime(); 
        
        // 2. Initial data fetch and render (runs immediately)
        fetchAndRenderSchedule();

        // 3. Set up the recurring data fetch every 5 seconds
        setInterval(fetchAndRenderSchedule, REFRESH_INTERVAL_MS);

        // 4. Set up the recurring time/date update and schedule re-evaluation every second
        setInterval(updateDateTime, CLOCK_INTERVAL_MS);
        
    </script>
</body>
</html>
