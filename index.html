<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
        }

        .status.error {
            background: #dc3545;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .calendar-nav button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .calendar-nav button:hover {
            background: #764ba2;
        }

        .current-month {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e9ecef;
            padding: 30px;
        }

        .day-header {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        .day-cell {
            background: white;
            min-height: 100px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .day-cell:hover {
            background: #f8f9fa;
            transform: scale(1.02);
        }

        .day-cell.other-month {
            background: #f8f9fa;
            color: #adb5bd;
        }

        .day-cell.today {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }

        .day-number {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .schedule-item {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #imagePreview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 10px;
            overflow: hidden;
        }

        #imagePreview img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .schedule-list {
            margin-top: 20px;
        }

        .schedule-list-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-list-item h4 {
            margin-bottom: 5px;
            color: #333;
        }

        .schedule-list-item p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .schedule-list-item p strong {
            color: #333;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 My Schedule Calendar</h1>
            <p>Click on any day to add or view schedules</p>
            <div class="status" id="connectionStatus">🔄 Connecting to server...</div>
        </div>

        <div class="calendar-nav">
            <button id="prevMonth">← Previous</button>
            <div class="current-month" id="currentMonth"></div>
            <button id="nextMonth">Next →</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="modal" id="scheduleModal">
        <div class="modal-content">
            <h2 id="modalTitle">Schedules for <span id="selectedDate"></span></h2>
            
            <div class="form-group">
                <label for="scheduleTitle">Title:</label>
                <input type="text" id="scheduleTitle" placeholder="Enter schedule title">
            </div>

            <div class="form-group">
                <label for="scheduleStartTime">Start Time:</label>
                <input type="time" id="scheduleStartTime">
            </div>

            <div class="form-group">
                <label for="scheduleEndTime">End Time:</label>
                <input type="time" id="scheduleEndTime">
            </div>

            <div class="form-group">
                <label for="scheduleSubject">Subject:</label>
                <input type="text" id="scheduleSubject" placeholder="e.g., Mathematics, Physics">
            </div>

            <div class="form-group">
                <label for="scheduleProfessor">Professor Name:</label>
                <input type="text" id="scheduleProfessor" placeholder="Enter professor name">
            </div>

            <div class="form-group">
                <label for="scheduleProfessorImage">Professor Image:</label>
                <input type="file" id="scheduleProfessorImage" accept="image/*">
                <div id="imagePreview" style="margin-top: 10px;"></div>
            </div>

            <div class="form-group">
                <label for="scheduleSemester">Semester:</label>
                <input type="text" id="scheduleSemester" placeholder="e.g., Fall 2024, Spring 2025">
            </div>

            <div class="form-group">
                <label for="scheduleDescription">Additional Notes:</label>
                <textarea id="scheduleDescription" placeholder="Enter additional notes (optional)"></textarea>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="saveSchedule">Save Schedule</button>
                <button class="btn btn-secondary" id="closeModal">Close</button>
            </div>

            <div class="schedule-list" id="scheduleList"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://192.168.1.245:5000/api';
        let currentDate = new Date();
        let selectedDateStr = '';
        let schedules = {};
        let selectedImageBase64 = '';

        const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'];

        // Handle image file selection
        document.addEventListener('DOMContentLoaded', function() {
            const imageInput = document.getElementById('scheduleProfessorImage');
            const imagePreview = document.getElementById('imagePreview');
            
            imageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5000000) { // 5MB limit
                        alert('Image file is too large. Please select an image smaller than 5MB.');
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        selectedImageBase64 = event.target.result;
                        imagePreview.innerHTML = `<img src="${selectedImageBase64}" alt="Professor Preview">`;
                    };
                    reader.readAsDataURL(file);
                } else {
                    selectedImageBase64 = '';
                    imagePreview.innerHTML = '';
                }
            });
        });

        // Load schedules from backend
        async function loadSchedules() {
            try {
                const response = await fetch(`${API_URL}/schedules`);
                if (response.ok) {
                    schedules = await response.json();
                    updateConnectionStatus(true);
                    renderCalendar();
                } else {
                    throw new Error('Failed to load schedules');
                }
            } catch (error) {
                console.error('Error loading schedules:', error);
                updateConnectionStatus(false);
            }
        }

        // Update connection status
        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            if (connected) {
                status.textContent = '✅ Connected to database';
                status.className = 'status';
            } else {
                status.textContent = '❌ Server not connected';
                status.className = 'status error';
            }
        }

        // Add schedule to backend
        async function addScheduleToBackend(date, title, start_time, end_time, subject, professor, professor_image, semester, description) {
            try {
                const response = await fetch(`${API_URL}/schedules`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ date, title, start_time, end_time, subject, professor, professor_image, semester, description })
                });
                
                if (response.ok) {
                    await loadSchedules();
                    return true;
                } else {
                    throw new Error('Failed to add schedule');
                }
            } catch (error) {
                console.error('Error adding schedule:', error);
                alert('Failed to save schedule. Please check if the server is running.');
                return false;
            }
        }

        // Delete schedule from backend
        async function deleteScheduleFromBackend(scheduleId) {
            try {
                const response = await fetch(`${API_URL}/schedules/${scheduleId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    await loadSchedules();
                    return true;
                } else {
                    throw new Error('Failed to delete schedule');
                }
            } catch (error) {
                console.error('Error deleting schedule:', error);
                alert('Failed to delete schedule. Please check if the server is running.');
                return false;
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonth').textContent = 
                `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';

            daysOfWeek.forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                calendarGrid.appendChild(header);
            });

            for (let i = firstDay - 1; i >= 0; i--) {
                const cell = createDayCell(daysInPrevMonth - i, month - 1, year, true);
                calendarGrid.appendChild(cell);
            }

            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = day === today.getDate() && 
                               month === today.getMonth() && 
                               year === today.getFullYear();
                const cell = createDayCell(day, month, year, false, isToday);
                calendarGrid.appendChild(cell);
            }

            const remainingCells = 42 - (firstDay + daysInMonth);
            for (let day = 1; day <= remainingCells; day++) {
                const cell = createDayCell(day, month + 1, year, true);
                calendarGrid.appendChild(cell);
            }
        }

        function createDayCell(day, month, year, isOtherMonth, isToday = false) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            if (isOtherMonth) cell.classList.add('other-month');
            if (isToday) cell.classList.add('today');

            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.textContent = day;
            cell.appendChild(dayNumber);

            if (schedules[dateStr]) {
                schedules[dateStr].forEach((schedule, index) => {
                    if (index < 2) {
                        const item = document.createElement('div');
                        item.className = 'schedule-item';
                        const timeRange = schedule.start_time && schedule.end_time 
                            ? `${schedule.start_time}-${schedule.end_time}` 
                            : schedule.start_time || '';
                        item.textContent = timeRange ? `${timeRange} ${schedule.title}` : schedule.title;
                        cell.appendChild(item);
                    }
                });
                if (schedules[dateStr].length > 2) {
                    const more = document.createElement('div');
                    more.className = 'schedule-item';
                    more.textContent = `+${schedules[dateStr].length - 2} more`;
                    cell.appendChild(more);
                }
            }

            cell.addEventListener('click', () => openModal(dateStr));
            return cell;
        }

        function openModal(dateStr) {
            selectedDateStr = dateStr;
            const date = new Date(dateStr + 'T00:00:00');
            document.getElementById('selectedDate').textContent = 
                date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            document.getElementById('scheduleTitle').value = '';
            document.getElementById('scheduleStartTime').value = '';
            document.getElementById('scheduleEndTime').value = '';
            document.getElementById('scheduleSubject').value = '';
            document.getElementById('scheduleProfessor').value = '';
            document.getElementById('scheduleProfessorImage').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('scheduleSemester').value = '';
            document.getElementById('scheduleDescription').value = '';
            selectedImageBase64 = '';
            
            renderScheduleList();
            document.getElementById('scheduleModal').classList.add('active');
        }

        function renderScheduleList() {
            const list = document.getElementById('scheduleList');
            list.innerHTML = '';

            if (schedules[selectedDateStr] && schedules[selectedDateStr].length > 0) {
                schedules[selectedDateStr].forEach((schedule) => {
                    const item = document.createElement('div');
                    item.className = 'schedule-list-item';
                    const timeRange = schedule.start_time && schedule.end_time 
                        ? `${schedule.start_time} - ${schedule.end_time}` 
                        : schedule.start_time || 'All day';
                    
                    let detailsHTML = `<h4>${timeRange}: ${schedule.title}</h4>`;
                    if (schedule.subject) detailsHTML += `<p><strong>Subject:</strong> ${schedule.subject}</p>`;
                    if (schedule.professor) {
                        detailsHTML += `<p><strong>Professor:</strong> ${schedule.professor}`;
                        if (schedule.professor_image) {
                            detailsHTML += ` <img src="${schedule.professor_image}" alt="${schedule.professor}" style="width:30px;height:30px;border-radius:50%;vertical-align:middle;margin-left:5px;">`;
                        }
                        detailsHTML += `</p>`;
                    }
                    if (schedule.semester) detailsHTML += `<p><strong>Semester:</strong> ${schedule.semester}</p>`;
                    if (schedule.description) detailsHTML += `<p><strong>Notes:</strong> ${schedule.description}</p>`;
                    
                    item.innerHTML = `
                        <div>
                            ${detailsHTML}
                        </div>
                        <button class="delete-btn" onclick="deleteSchedule(${schedule.id})">Delete</button>
                    `;
                    list.appendChild(item);
                });
            }
        }

        async function deleteSchedule(scheduleId) {
            if (confirm('Are you sure you want to delete this schedule?')) {
                const success = await deleteScheduleFromBackend(scheduleId);
                if (success) {
                    renderScheduleList();
                }
            }
        }

        document.getElementById('saveSchedule').addEventListener('click', async () => {
            const title = document.getElementById('scheduleTitle').value.trim();
            const start_time = document.getElementById('scheduleStartTime').value;
            const end_time = document.getElementById('scheduleEndTime').value;
            const subject = document.getElementById('scheduleSubject').value.trim();
            const professor = document.getElementById('scheduleProfessor').value.trim();
            const professor_image = selectedImageBase64; // Use base64 image
            const semester = document.getElementById('scheduleSemester').value.trim();
            const description = document.getElementById('scheduleDescription').value.trim();

            if (!title) {
                alert('Please enter a title for your schedule');
                return;
            }

            if (start_time && end_time && start_time >= end_time) {
                alert('End time must be after start time');
                return;
            }

            const success = await addScheduleToBackend(selectedDateStr, title, start_time, end_time, subject, professor, professor_image, semester, description);
            if (success) {
                document.getElementById('scheduleTitle').value = '';
                document.getElementById('scheduleStartTime').value = '';
                document.getElementById('scheduleEndTime').value = '';
                document.getElementById('scheduleSubject').value = '';
                document.getElementById('scheduleProfessor').value = '';
                document.getElementById('scheduleProfessorImage').value = '';
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('scheduleSemester').value = '';
                document.getElementById('scheduleDescription').value = '';
                selectedImageBase64 = '';
                renderScheduleList();
            }
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('scheduleModal').classList.remove('active');
        });

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Initialize
        loadSchedules();
    </script>
</body>
</html>
